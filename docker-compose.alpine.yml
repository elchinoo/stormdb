# ========================================================================
# StormDB Optimized Container Orchestration
# Supports both Docker and Podman with Alpine-based smaller images
# ========================================================================

services:
  # Development environment with Alpine base (much smaller)
  stormdb-dev:
    build:
      context: .
      dockerfile: Dockerfile.alpine
      target: development
    image: stormdb:latest-dev-alpine
    container_name: stormdb-dev-alpine
    volumes:
      - .:/workspace
      - stormdb-cache:/tmp/stormdb-cache
    working_dir: /workspace
    ports:
      - "2222:22"  # SSH for remote development
    environment:
      - TERM=xterm-256color
      - STORMDB_ENV=development
    stdin_open: true
    tty: true
    networks:
      - stormdb-net

  # VS Code development container (Alpine-based)
  stormdb-vscode:
    build:
      context: .
      dockerfile: Dockerfile.alpine
      target: vscode
    image: stormdb:latest-vscode-alpine
    container_name: stormdb-vscode-alpine
    volumes:
      - .:/workspace
      - stormdb-vscode-extensions:/root/.vscode-server
    working_dir: /workspace
    ports:
      - "2223:22"
    environment:
      - STORMDB_ENV=development
    networks:
      - stormdb-net

  # Testing environment
  stormdb-test:
    build:
      context: .
      dockerfile: Dockerfile.alpine
      target: testing
    image: stormdb:latest-test-alpine
    container_name: stormdb-test-alpine
    volumes:
      - .:/workspace
      - stormdb-test-results:/workspace/test-results
    working_dir: /workspace
    environment:
      - STORMDB_ENV=testing
    depends_on:
      - postgres-test
    networks:
      - stormdb-net

  # Production container (minimal size)
  stormdb-prod:
    build:
      context: .
      dockerfile: Dockerfile.alpine
      target: production
    image: stormdb:latest-prod-alpine
    container_name: stormdb-prod-alpine
    environment:
      - STORMDB_ENV=production
    depends_on:
      - postgres-test
    networks:
      - stormdb-net
    restart: unless-stopped

  # PostgreSQL test database (Alpine-based)
  postgres-test:
    image: postgres:16-alpine  # Much smaller than regular postgres
    container_name: postgres-test-alpine
    environment:
      POSTGRES_DB: stormdb_test
      POSTGRES_USER: stormdb
      POSTGRES_PASSWORD: stormdb_test_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - stormdb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stormdb -d stormdb_test"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volumes for persistence
volumes:
  stormdb-cache:
    driver: local
  stormdb-vscode-extensions:
    driver: local
  stormdb-test-results:
    driver: local
  postgres-test-data:
    driver: local

# Custom network for service communication
networks:
  stormdb-net:
    driver: bridge
