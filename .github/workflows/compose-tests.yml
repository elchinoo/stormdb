name: Compose Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  compose-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Start services and run tests in compose
        run: ./scripts/ci/run_in_compose.sh stormdb-test
        env:
          DOCKER_BUILDKIT: 1
          POSTGRES_TEST_HOST: postgres-test
          POSTGRES_TEST_PORT: 5432
          POSTGRES_TEST_DB: stormdb_test
          POSTGRES_TEST_USER: stormdb
          POSTGRES_TEST_PASSWORD: stormdb_test
  memcheck:
    runs-on: ubuntu-latest
    needs: compose-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Run memcheck in compose
        run: make memcheck-compose
        env:
          DOCKER_BUILDKIT: 1
