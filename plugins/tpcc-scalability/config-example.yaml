# TPC-C Scalability Plugin Configuration Examples

# Basic Configuration - Minimal TPC-C test
basic_config:
  host: "localhost"
  port: 5432
  database: "tpcc"
  username: "postgres"
  password: "password"
  ssl_mode: "disable"
  
  scale: 1
  connections: [10, 20]
  duration: "2m"
  warmup_time: "30s"
  
  rebuild: true
  enable_metrics: true

# Standard Configuration - Full TPC-C compliance
standard_config:
  host: "localhost"
  port: 5432
  database: "tpcc"
  username: "postgres"
  password: "password"
  ssl_mode: "disable"
  
  # TPC-C Standard Parameters
  scale: 10
  connections: [50, 100, 200]
  duration: "10m"
  warmup_time: "2m"
  think_time: "1ms"
  
  # Standard TPC-C transaction mix
  new_order_pct: 45
  payment_pct: 43
  order_status_pct: 4
  delivery_pct: 4
  stock_level_pct: 4
  cross_warehouse: 15
  
  drop_tables: true
  rebuild: true
  enable_metrics: true
  log_transactions: false
  verbose: true

# Performance Testing Configuration
performance_config:
  host: "db.example.com"
  port: 5432
  database: "tpcc_perf"
  username: "tpcc_user"
  password: "secure_password"
  ssl_mode: "require"
  
  # Large scale testing
  scale: 50
  connections: [100, 200, 400, 800, 1600]
  duration: "30m"
  warmup_time: "5m"
  think_time: "0ms"
  
  # Standard mix
  new_order_pct: 45
  payment_pct: 43
  order_status_pct: 4
  delivery_pct: 4
  stock_level_pct: 4
  cross_warehouse: 15
  
  drop_tables: false
  rebuild: false
  enable_metrics: true
  log_transactions: true
  verbose: true

# Development Configuration - Quick testing
dev_config:
  host: "localhost"
  port: 5432
  database: "tpcc_dev"
  username: "dev"
  password: "dev"
  ssl_mode: "disable"
  
  scale: 1
  connections: [5, 10]
  duration: "30s"
  warmup_time: "10s"
  think_time: "10ms"
  
  # Modified mix for faster testing
  new_order_pct: 50
  payment_pct: 30
  order_status_pct: 5
  delivery_pct: 10
  stock_level_pct: 5
  cross_warehouse: 10
  
  drop_tables: true
  rebuild: true
  enable_metrics: true
  log_transactions: true
  verbose: true
