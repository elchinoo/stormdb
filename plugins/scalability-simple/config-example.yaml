# TPC-C Scalability Test Plugin Configuration Example

plugin_config:
  # Database connection settings
  host: "localhost"
  port: 5432
  database: "tpcc_test"
  username: "postgres"
  password: "postgres"
  ssl_mode: "disable"

  # Test scale and configuration
  scale: 10                    # Number of warehouses (scale factor)
  connections: [48, 96, 192, 256]  # Connection levels to test
  duration: "5m"               # Duration per connection level
  warmup_time: "30s"          # Warmup time before measurements
  think_time: "100ms"         # Delay between transactions

  # Transaction mix percentages (must sum to 100)
  new_order_pct: 45           # New Order transactions
  payment_pct: 43             # Payment transactions  
  order_status_pct: 4         # Order Status transactions
  delivery_pct: 4             # Delivery transactions
  stock_level_pct: 4          # Stock Level transactions

  # Performance and monitoring settings
  batch_size: 100             # Batch size for result storage
  enable_metrics: true        # Enable detailed metrics collection
  log_transactions: false     # Log individual transactions (verbose)

# Alternative configurations for different test scenarios

# Quick test configuration
quick_test:
  scale: 5
  connections: [24, 48]
  duration: "2m"
  warmup_time: "15s"
  new_order_pct: 45
  payment_pct: 43
  order_status_pct: 4
  delivery_pct: 4
  stock_level_pct: 4

# Stress test configuration  
stress_test:
  scale: 50
  connections: [128, 256, 512, 1000]
  duration: "10m"
  warmup_time: "1m"
  think_time: "50ms"
  new_order_pct: 50
  payment_pct: 40
  order_status_pct: 3
  delivery_pct: 3
  stock_level_pct: 4

# Latency focused test
latency_test:
  scale: 20
  connections: [48, 96, 144, 192]
  duration: "15m"
  warmup_time: "2m"
  think_time: "200ms"
  enable_metrics: true
  log_transactions: true
  new_order_pct: 45
  payment_pct: 43
  order_status_pct: 4
  delivery_pct: 4
  stock_level_pct: 4
